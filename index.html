<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>portip — Personal</title>
<meta name="description" content="Premium personal bio landing page." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --radius: 26px;
    --radius-sm: 16px;
    --avatar-radius: 20px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Space Grotesk", var(--font);
    --maxw: 560px;
  }
  html[data-theme="dark"] {
    --bg: #000000; --fg: #ffffff; --inv-bg: #ffffff; --inv-fg: #000000;
    --g-050: rgba(255,255,255,0.05); --g-080: rgba(255,255,255,0.08);
    --g-120: rgba(255,255,255,0.12); --g-200: rgba(255,255,255,0.20);
    --muted: rgba(255,255,255,0.55); --muted-2: rgba(255,255,255,0.38);
    --panel: rgba(20,20,20,0.55); --panel-2: rgba(28,28,28,0.42);
    --grid: rgba(255,255,255,0.035); --particle: 255,255,255;
    --aura: rgba(255,255,255,0.05);
    --shadow: 0 24px 70px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
    --shadow-soft: 0 10px 40px rgba(0,0,0,0.4);
    --hover-shadow: rgba(255,255,255,0.16);
  }
  html[data-theme="light"] {
    --bg: #f4f4f5; --fg: #0a0a0a; --inv-bg: #0a0a0a; --inv-fg: #ffffff;
    --g-050: rgba(0,0,0,0.04); --g-080: rgba(0,0,0,0.07);
    --g-120: rgba(0,0,0,0.12); --g-200: rgba(0,0,0,0.22);
    --muted: rgba(0,0,0,0.6); --muted-2: rgba(0,0,0,0.42);
    --panel: rgba(255,255,255,0.72); --panel-2: rgba(255,255,255,0.5);
    --grid: rgba(0,0,0,0.04); --particle: 0,0,0;
    --aura: rgba(0,0,0,0.045);
    --shadow: 0 24px 70px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.06);
    --shadow-soft: 0 10px 40px rgba(0,0,0,0.1);
    --hover-shadow: rgba(0,0,0,0.16);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--fg);
    line-height: 1.5; letter-spacing: -0.01em; min-height: 100vh;
    min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
    transition: background 0.5s var(--ease), color 0.5s var(--ease);
  }
  ::selection { background: var(--inv-bg); color: var(--inv-fg); }
  a { color: inherit; text-decoration: none; }

  /* ===== BACKGROUND ===== */
  .bg-aurora { position: fixed; inset: -20%; z-index: 0; pointer-events: none; filter: blur(60px); }
  .bg-aurora span {
    position: absolute; display: block; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--aura), transparent 70%);
    opacity: 0.9; will-change: transform;
  }
  .bg-aurora .a1 { width: 55vw; height: 55vw; top: -10%; left: -10%; animation: drift1 26s ease-in-out infinite; }
  .bg-aurora .a2 { width: 48vw; height: 48vw; bottom: -12%; right: -8%; animation: drift2 32s ease-in-out infinite; }
  .bg-aurora .a3 { width: 40vw; height: 40vw; top: 30%; left: 40%; animation: drift3 38s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(8vw,6vh) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1.1); } 50% { transform: translate(-7vw,-5vh) scale(0.95); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(0.9); } 50% { transform: translate(-6vw,7vh) scale(1.1); } }

  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 35%, transparent 100%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 35%, transparent 100%);
    animation: gridDrift 40s linear infinite;
  }
  @keyframes gridDrift { from { background-position: 0 0; } to { background-position: 46px 46px; } }

  .bg-vignette {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 90% 70% at 50% 40%, transparent 55%, rgba(0,0,0,0.35) 100%);
    animation: breathe 12s ease-in-out infinite;
  }
  html[data-theme="light"] .bg-vignette { background: radial-gradient(ellipse 90% 70% at 50% 40%, transparent 55%, rgba(0,0,0,0.06) 100%); }
  @keyframes breathe { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }

  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.55; }

  /* ===== CUSTOM CURSOR ===== */
  .cursor-ring, .cursor-dot { position: fixed; top: 0; left: 0; z-index: 60; pointer-events: none; opacity: 0; }
  .cursor-ring {
    width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    border: 1px solid rgba(var(--particle), 0.35);
    box-shadow: 0 0 12px rgba(var(--particle), 0.08), inset 0 0 8px rgba(var(--particle), 0.04);
    transition: width .25s var(--ease), height .25s var(--ease), margin .25s var(--ease),
                border-color .25s var(--ease), background .25s var(--ease), opacity .3s var(--ease);
    will-change: transform;
  }
  .cursor-ring.hot {
    width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-color: rgba(var(--particle), 0.5); background: rgba(var(--particle), 0.04);
  }
  .cursor-dot {
    width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
    background: rgba(var(--particle), 0.7); will-change: transform; transition: opacity .3s var(--ease);
  }
  @media (pointer: fine) { body.custom-cursor, body.custom-cursor a, body.custom-cursor button { cursor: none; } }

  .topbar { position: fixed; top: 0; right: 0; z-index: 20; padding: 16px clamp(16px, 4vw, 28px); pointer-events: none; }
  .theme-toggle {
    pointer-events: auto; display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 999px; border: 1px solid var(--g-120);
    background: var(--panel); color: var(--fg); font-family: var(--font-display); font-size: 13px; font-weight: 600;
    cursor: pointer; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform 0.3s var(--ease), border-color 0.3s var(--ease);
  }
  .theme-toggle:hover { transform: translateY(-2px); border-color: var(--g-200); }
  .theme-toggle:active { transform: translateY(0) scale(0.97); }
  .theme-toggle svg { width: 17px; height: 17px; }
  html[data-theme="dark"] .theme-toggle .ic-sun { display: none; }
  html[data-theme="light"] .theme-toggle .ic-moon { display: none; }
  .theme-toggle .label::after { content: "Dark"; }
  html[data-theme="light"] .theme-toggle .label::after { content: "Light"; }

  .shell {
    position: relative; z-index: 2; max-width: var(--maxw); margin: 0 auto;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center;
    gap: clamp(16px, 3vw, 22px);
    padding: clamp(80px, 12vw, 110px) clamp(16px, 5vw, 22px) clamp(40px, 8vw, 64px);
  }
  .reveal { opacity: 0; transform: translateY(20px); }
  .reveal.in { opacity: 1; transform: none; transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); }

  .panel {
    position: relative;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--g-120); border-radius: var(--radius); box-shadow: var(--shadow);
    backdrop-filter: blur(20px) saturate(125%); -webkit-backdrop-filter: blur(20px) saturate(125%);
    padding: clamp(24px, 5vw, 34px);
  }
  .glow-border::before {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
    background: conic-gradient(from var(--angle,0deg),
      transparent 0deg, rgba(var(--particle),0.55) 40deg, transparent 120deg,
      transparent 240deg, rgba(var(--particle),0.35) 300deg, transparent 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none; opacity: 0.55; animation: spin 6s linear infinite;
  }
  @property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --angle: 360deg; } }

  .profile { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .avatar-wrap { position: relative; width: min(100%, 360px); aspect-ratio: 500 / 281; animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .avatar {
    width: 100%; height: 100%; object-fit: cover; display: block;
    border-radius: var(--avatar-radius); border: 1.5px solid var(--g-200);
    box-shadow: 0 0 0 6px var(--g-050), var(--shadow-soft); background: var(--g-080); color: var(--fg);
  }
  .avatar-ring {
    position: absolute; inset: -8px; border-radius: calc(var(--avatar-radius) + 8px);
    background: conic-gradient(from 0deg, rgba(var(--particle),0.55), transparent 40%, transparent 60%, rgba(var(--particle),0.3)) border-box;
    -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 8s linear infinite; opacity: 0.75;
  }
  .name {
    font-family: var(--font-display);
    font-size: clamp(34px, 8.5vw, 56px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.02;
    background: linear-gradient(180deg, var(--fg), var(--muted));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .bio { color: var(--muted); max-width: 420px; font-size: clamp(14px, 3.6vw, 16px); }

  .status {
    position: relative; overflow: hidden;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 9px 18px 9px 16px; border-radius: 999px;
    border: 1px solid var(--g-120);
    background: linear-gradient(180deg, var(--g-080), var(--g-050));
    font-family: var(--font-display); font-size: 12px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg);
    box-shadow: var(--shadow-soft);
  }
  .status::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(var(--particle),0.14) 50%, transparent 70%);
    transform: translateX(-120%); animation: shimmer 4.5s var(--ease) infinite;
  }
  @keyframes shimmer { 0%, 60% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
  .status .pip { position: relative; width: 9px; height: 9px; flex: 0 0 auto; }
  .status .pip span { position: absolute; inset: 0; border-radius: 50%; background: var(--fg); }
  .status .pip span::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--fg); animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3); opacity: 0; } }

  .connect { display: flex; flex-direction: column; gap: 12px; }
  .tg {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 16px;
    width: 100%; padding: 18px 22px; border-radius: var(--radius-sm);
    border: 1px solid var(--g-200); background: var(--g-050); color: var(--fg); cursor: pointer;
    transition: transform 0.4s var(--ease), background 0.4s var(--ease), color 0.4s var(--ease),
                box-shadow 0.4s var(--ease), border-color 0.4s var(--ease);
  }
  .tg:hover { transform: translateY(-4px); background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); box-shadow: 0 20px 46px var(--hover-shadow); }
  .tg:active { transform: translateY(-1px) scale(0.995); }
  .tg-ic {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;
    border: 1px solid var(--g-200); background: var(--g-050);
    transition: background 0.4s var(--ease), border-color 0.4s var(--ease);
  }
  .tg:hover .tg-ic { background: rgba(var(--particle),0.08); border-color: transparent; }
  .tg-ic svg { width: 24px; height: 24px; }
  .tg-txt { display: flex; flex-direction: column; text-align: left; line-height: 1.25; }
  .tg-txt .t { font-family: var(--font-display); font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
  .tg-txt .h { font-size: 13px; color: var(--muted); transition: color 0.4s var(--ease); }
  .tg:hover .tg-txt .h { color: inherit; opacity: 0.7; }
  .tg-arrow { margin-left: auto; flex: 0 0 auto; transition: transform 0.4s var(--ease); }
  .tg-arrow svg { width: 20px; height: 20px; display: block; }
  .tg:hover .tg-arrow { transform: translateX(4px); }
  .ripple { position: absolute; border-radius: 50%; transform: scale(0); background: rgba(var(--particle),0.3); pointer-events: none; animation: rippleAnim 0.6s ease-out; }
  @keyframes rippleAnim { to { transform: scale(3.2); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
    .cursor-ring, .cursor-dot { display: none; }
  }
</style>
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="bg-vignette" aria-hidden="true"></div>

  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>
  <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

  <header class="topbar">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
      <span class="label"></span>
    </button>
  </header>

  <main class="shell">
    <section class="panel glow-border reveal profile" aria-label="Profile">
      <div class="avatar-wrap">
        <span class="avatar-ring" aria-hidden="true"></span>
        <!-- GIF 500x281. Положи avatar.gif рядом с index.html -->
        <img class="avatar" src="avatar.gif" alt="LO" width="500" height="281" />
      </div>
      <h1 class="name">portip</h1>
      <p class="bio">Less noise. More signal.</p>
      <span class="status">
        <span class="pip" aria-hidden="true"><span></span></span>
        Available for work
      </span>
    </section>

    <section class="connect reveal" aria-label="Contact">
  <a class="tg" href="https://t.me/KPYTOU_PEREC" target="_blank" rel="noopener" aria-label="Message me on Telegram">
    <span class="tg-ic">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.94 4.6 18.9 19.02c-.23 1.02-.84 1.27-1.7.79l-4.7-3.46-2.27 2.18c-.25.25-.46.46-.94.46l.33-4.77 8.68-7.84c.38-.34-.08-.53-.59-.19L6.72 13.2l-4.63-1.45c-1-.31-1.02-1 .21-1.48l18.1-6.98c.84-.31 1.57.2 1.3 1.31Z"/></svg>
    </span>
    <span class="tg-txt">
      <span class="t">Сontact for me</span>
      <span class="h">@KPYTOU_PEREC</span>
    </span>
    <span class="tg-arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </span>
  </a>
</section>
  </main>

<script>
(() => {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const root = document.documentElement;

  const saved = localStorage.getItem("theme");
  if (saved) root.setAttribute("data-theme", saved);
  else if (matchMedia("(prefers-color-scheme: light)").matches) root.setAttribute("data-theme", "light");
  document.getElementById("themeToggle").addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next); localStorage.setItem("theme", next);
  });

  const io = new IntersectionObserver((es) => {
    es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach((el, i) => { el.style.transitionDelay = (i * 90) + "ms"; io.observe(el); });

  /* ===== custom cursor ===== */
  if (!reduce && matchMedia("(pointer:fine)").matches) {
    document.body.classList.add("custom-cursor");
    const ring = document.getElementById("cursorRing");
    const dot = document.getElementById("cursorDot");
    let tx = 0, ty = 0, rx = 0, ry = 0, on = false, hovering = false;
    addEventListener("pointermove", (e) => {
      tx = e.clientX; ty = e.clientY;
      dot.style.transform = `translate(${tx}px, ${ty}px)`;
      if (!on) { on = true; ring.style.opacity = "1"; dot.style.opacity = "1"; }
    });
    addEventListener("pointerdown", () => ring.classList.add("hot"));
    addEventListener("pointerup", () => { if (!hovering) ring.classList.remove("hot"); });
    document.querySelectorAll("a, button").forEach((el) => {
      el.addEventListener("pointerenter", () => { hovering = true; ring.classList.add("hot"); });
      el.addEventListener("pointerleave", () => { hovering = false; ring.classList.remove("hot"); });
    });
    addEventListener("mouseleave", () => { ring.style.opacity = "0"; dot.style.opacity = "0"; });
    (function loop(){ rx += (tx-rx)*0.18; ry += (ty-ry)*0.18; ring.style.transform = `translate(${rx}px, ${ry}px)`; requestAnimationFrame(loop); })();
  }

  document.querySelectorAll(".tg").forEach((btn) => {
    btn.addEventListener("pointerdown", (e) => {
      const r = document.createElement("span"), rect = btn.getBoundingClientRect(), size = Math.max(rect.width, rect.height);
      r.className = "ripple"; r.style.width = r.style.height = size + "px";
      r.style.left = (e.clientX - rect.left - size/2) + "px"; r.style.top = (e.clientY - rect.top - size/2) + "px";
      btn.appendChild(r); setTimeout(() => r.remove(), 600);
    });
  });

  /* ===== particles (faster) ===== */
  if (!reduce) {
    const cv = document.getElementById("particles"), ctx = cv.getContext("2d");
    let w, h, dpr, parts = [];
    const resize = () => {
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = cv.width = innerWidth*dpr; h = cv.height = innerHeight*dpr;
      cv.style.width = innerWidth+"px"; cv.style.height = innerHeight+"px";
      const count = Math.min(80, Math.floor(innerWidth/20));
      parts = Array.from({length:count}, () => ({ x:Math.random()*w, y:Math.random()*h,
        vx:(Math.random()-0.5)*0.5*dpr, vy:(Math.random()-0.5)*0.5*dpr,
        r:(Math.random()*1.3+0.4)*dpr, a:Math.random()*0.45+0.1 }));
    };
    (function tick(){
      ctx.clearRect(0,0,w,h);
      const col = getComputedStyle(root).getPropertyValue("--particle").trim();
      for (const p of parts){ p.x+=p.vx; p.y+=p.vy;
        if (p.x<0||p.x>w) p.vx*=-1; if (p.y<0||p.y>h) p.vy*=-1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle = "rgba("+col+","+p.a+")"; ctx.fill(); }
      requestAnimationFrame(tick);
    })();
    resize(); addEventListener("resize", resize, { passive:true });
  }
})();
</script>
</body>
</html>
