<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КРУТОЙ ПЕРЕЦ | Ссылки</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Эффекты на фоне -->
    <div class="noise-overlay"></div>
    <canvas id="snow" class="snow-canvas"></canvas>

    <div class="main-wrapper">
        
        <!-- Аватарка (с RGB рамкой и повернутой фоткой) -->
        <div class="avatar-container">
            <div class="avatar-inner">
                <img src="avatar.jpg" alt="Аватарка" style="width: 100%; height: 100%; object-fit: cover; border-radius: 15px; transform: rotate(-90deg);">
            </div>
        </div>

        <!-- НОВЫЙ НИК И ЮЗЕРНЕЙМ -->
        <div class="mb-10 flex flex-col items-center">
            <h1 class="new-nickname">
                КРУТОЙ <span>ПЕРЕЦ</span>
            </h1>
            <div class="username-badge">
                <i class="fa-brands fa-telegram text-white/40"></i> KRYTOU_PEREC
            </div>
        </div>

        <!-- Кнопка "Обо мне" (ведет на index2.html) -->
        <a href="index2.html" class="btn-link btn-main">
            My Information
        </a>

        <div class="section-label badge-font">Ссылки</div>
        
        <!-- Ровные и стильные кнопки -->
        <div>
            <a href="https://t.me/KRYTOU_PEREC" target="_blank" class="btn-link group">
                <span>TG</span>
                <i class="fa-brands fa-telegram-plane opacity-30 group-hover:opacity-100 transition duration-300"></i>
            </a>

            <!-- Кнопка "Проекты" (ведет на project.html) -->
            <a href="project.html" class="btn-link group">
                <span>PROJECT</span>
                <i class="fa-solid fa-code opacity-30 group-hover:opacity-100 transition duration-300"></i>
            </a>

          

        <footer class="badge-font">
            КРУТОЙ ПЕРЕЦ © 2024
        </footer>
    </div>

    <!-- Твой файл со снегом -->
    <script src="script.js"></script>
</body>
</html>
