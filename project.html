<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КРУТОЙ ПЕРЕЦ | Проекты</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Space+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');

        :root {
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.02);
            --red-accent: #ff3e3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #ffffff;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .snow-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.04;
            pointer-events: none;
            z-index: 100;
        }

        .main-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px; /* Вернул ширину как на главной для идеальных пропорций */
            padding: 30px 20px;
            z-index: 10;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Шрифты */
        .title-font { font-family: 'Orbitron', sans-serif; }
        .text-font { font-family: 'Rajdhani', sans-serif; }
        .code-font { font-family: 'Space Mono', monospace; }

        .name-red {
            color: var(--red-accent);
        }

        /* Кнопка НАЗАД */
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            margin-bottom: 30px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 0.2em;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* ЗАГОЛОВОК СТРАНИЦЫ */
        .section-header {
            font-size: 10px;
            letter-spacing: 0.4em;
            opacity: 0.3;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
        }

        /* === СТРОГИЕ КАРТОЧКИ-КНОПКИ === */
        .project-block {
            display: block;
            width: 100%;
            padding: 22px 24px;
            margin-bottom: 12px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .project-block:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
        }

        /* Верхняя часть карточки (Название и Иконка) */
        .project-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .project-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: #fff;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .project-icon {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            transition: 0.3s ease;
        }

        .project-block:hover .project-icon {
            color: var(--red-accent);
        }

        /* Описание */
        .project-desc {
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.5;
            margin-bottom: 16px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .project-block:hover .project-desc {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Теги (Стек технологий) */
        .project-tags {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            color: var(--red-accent);
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Футер */
        footer {
            margin-top: 40px;
            opacity: 0.2;
            font-size: 9px;
            letter-spacing: 0.1em;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <canvas id="snow" class="snow-canvas"></canvas>

    <div class="main-wrapper">
        
        <!-- Кнопка назад -->
        <a href="index.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Назад
        </a>

        <div class="section-header">Проекты</div>

        

        <!-- ПРОЕКТ 3 -->
        <a href="#" target="_blank" class="project-block" style="opacity: 0.6;">
            <div class="project-top">
                <span class="project-name text-white/50">Unknown</span>
                <i class="fa-solid fa-lock project-icon"></i>
            </div>
            <div class="project-desc">
                Проект находится в стадии закрытого тестирования. Доступ ограничен.
            </div>
            <div class="project-tags" style="color: rgba(255,255,255,0.3);">In Development</div>
        </a>

        <footer>
            КРУТОЙ ПЕРЕЦ © 2024
        </footer>

    </div>

    <!-- Скрипт снега -->
    <script>
        const canvas = document.getElementById('snow');
        const ctx = canvas.getContext('2d');
        let width, height, flakes;

        function initSnow() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            flakes = [];
            const count = Math.floor(width / 5); 
            for (let i = 0; i < count; i++) {
                flakes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    speed: Math.random() * 1 + 0.5,
                    opacity: Math.random() * 0.5 + 0.2,
                    swing: Math.random() * Math.PI * 2
                });
            }
        }

        function updateSnow() {
            ctx.clearRect(0, 0, width, height);
            flakes.forEach(flake => {
                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`;
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.fill();
                flake.y += flake.speed;
                flake.swing += 0.02;
                flake.x += Math.sin(flake.swing) * 0.5;
                if (flake.y > height) {
                    flake.y = -5;
                    flake.x = Math.random() * width;
                }
                if (flake.x > width) flake.x = 0;
                if (flake.x < 0) flake.x = width;
            });
            requestAnimationFrame(updateSnow);
        }

        window.addEventListener('resize', initSnow);
        initSnow();
        updateSnow();
    </script>
</body>
</html>
